apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-deployment
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:latest
          ports:
            - containerPort: 5678
          env:
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: GENERIC_TIMEZONE
              value: "Europe/Berlin"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "false"
          volumeMounts:
            - name: tls-certificates
              mountPath: /home/node/.n8n/certs
              readOnly: true
      volumes:
        - name: tls-certificates
          secret:
            secretName: n8n-tls-secret
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-service
  namespace: n8n
spec:
  selector:
    app: n8n
  ports:
    - protocol: TCP
      port: 5678
      targetPort: 5678
  type: LoadBalancer
  loadBalancerIP: 192.168.1.175
